name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Unzip newest upload
        run: |
          Z=$(git log --name-only --pretty=format: --diff-filter=AM -- '*.zip' | grep -v '^$' | head -1)
          echo "Using $Z"
          unzip -qo "$Z"
      - run: gradle assembleDebug --no-daemon
        working-directory: council-ai-android
      - run: cp council-ai-android/app/build/outputs/apk/debug/app-debug.apk CouncilAI.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Council AI build ${{ github.run_number }}
          files: CouncilAI.apk
